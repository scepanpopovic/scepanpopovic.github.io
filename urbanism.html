<title>Urbanism — Šćepan Popović</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    font-family: "Courier New", Courier, monospace;
    background: #ffffff;
    color: #111;
    font-size: 11px;
}


/* =========================
   HEADER
========================= */

header {
    height: 72px;
    background: #000;
    color: #fff;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 30px;
}

.logo {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: #fff;
}

.logo-name {
    font-size: 15px;
    font-weight: bold;
}

.logo-about {
    font-size: 7px;
    margin-top: 5px;
    color: #bfff00;
}

nav {
    display: flex;
    align-items: center;
    gap: 14px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 10px;
    font-weight: bold;
}

nav a:hover,
nav a.active {
    color: #bfff00;
}

.separator {
    color: white;
}


/* =========================
   PAGE
========================= */

main {
    padding: 55px 30px 100px;
}

.page-title {
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 35px;
}


/* =========================
   PROJECT GRID
========================= */

.projects {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 70px 28px;

    max-width: 1250px;
}

.project {
    text-decoration: none;
    color: #111;
    display: block;
}

.project-image {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #eee;
}

.project-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity .2s ease;
}

.project:hover img {
    opacity: .75;
}

.project-number {
    position: absolute;
    left: 8px;
    top: 8px;

    background: #000;
    color: #fff;

    padding: 5px 7px;
    font-size: 9px;
}

.project-info {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;

    margin-top: 9px;
}

.project-title {
    font-weight: bold;
    text-transform: uppercase;
}

.project-location {
    text-align: right;
}

.project-meta {
    margin-top: 4px;
    font-size: 9px;
    color: #555;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    header {
        height: auto;
        padding: 20px;
        align-items: flex-start;
        gap: 25px;
    }

    nav {
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    main {
        padding: 40px 20px 80px;
    }

    .projects {
        grid-template-columns: 1fr;
    }
}

</style>

</head>
